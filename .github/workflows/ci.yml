name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 33317:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - name: Check out migration toolkit
        uses: actions/checkout@v4
        with:
          path: trinitycore-azerothcore-db-migrator

      - name: Check out reviewed TrinityCore 3.3.5
        uses: actions/checkout@v4
        with:
          repository: TrinityCore/TrinityCore
          ref: 92127cd6252edb96fbfa36540db0eba17d0031fa
          path: TrinityCore

      - name: Check out reviewed AzerothCore
        uses: actions/checkout@v4
        with:
          repository: azerothcore/azerothcore-wotlk
          ref: 1cd97629ed6ef49f5c70dec39316846381d2e450
          path: azerothcore-wotlk

      - name: Install static-analysis tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep shellcheck default-mysql-client python3

      - name: Run static checks
        working-directory: trinitycore-azerothcore-db-migrator
        run: tests/static-checks.sh

      - name: Run disposable bidirectional MySQL rehearsals
        working-directory: trinitycore-azerothcore-db-migrator
        env:
          MIGRATOR_DISPOSABLE_MYSQL: '1'
        run: tests/rehearsal-tests.sh
