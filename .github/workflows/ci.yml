name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out migration toolkit
        uses: actions/checkout@v4
        with:
          path: trinitycore-azerothcore-db-migrator

      - name: Check out current TrinityCore 3.3.5
        uses: actions/checkout@v4
        with:
          repository: TrinityCore/TrinityCore
          ref: 3.3.5
          path: TrinityCore

      - name: Check out current AzerothCore master
        uses: actions/checkout@v4
        with:
          repository: azerothcore/azerothcore-wotlk
          ref: master
          path: azerothcore-wotlk

      - name: Install static-analysis tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep shellcheck

      - name: Run static checks
        working-directory: trinitycore-azerothcore-db-migrator
        run: tests/static-checks.sh
